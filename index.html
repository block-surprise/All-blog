
<!DOCTYPE html>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f7fb;
    color: #111;
}

.nav {
    background: #111;
    padding: 12px 18px;
    display: flex;
    gap: 14px;
    position: sticky;
    top: 0;
    overflow-x: auto;
}

.nav a {
    color: white;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    opacity: 0.85;
    padding: 6px 10px;
    border-radius: 8px;
    white-space: nowrap;
}

.nav a:hover {
    opacity: 1;
    background: rgba(255,255,255,0.12);
}

header {
    background: white;
    padding: 18px;
    border-bottom: 1px solid #eee;
}

header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
}
.keywords {
    display: flex;
    overflow-x: auto;
    gap: 8px;
    padding: 10px;
    background: white;
    border-bottom: 1px solid #eee;
}

.keywords a {
    white-space: nowrap;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 999px;
    background: #f1f5f9;
    text-decoration: none;
    color: #111;
}
.container {
    max-width: 780px;
    margin: auto;
    padding: 10px 12px;
}

.card {
    display: block;
    background: white;
    padding: 14px;
    border-bottom: 1px solid #eee;
    text-decoration: none;
    color: inherit;
}

.card:hover {
    background: #f9fafb;
}
.categories {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 10px;
}

.categories a {
    background: white;
    padding: 12px;
    text-align: center;
    border-radius: 10px;
    text-decoration: none;
    font-size: 13px;
    border: 1px solid #eee;
}
.tag {
    display: inline-block;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    color: white;
    margin-bottom: 6px;
}

.title {
    font-size: 15px;
    font-weight: 600;
}

.meta {
    font-size: 12px;
    color: #888;
}

@media (max-width: 600px) {
    header h1 {
        font-size: 16px;
    }

    .card {
        padding: 12px;
    }
}
</style>
</head>
