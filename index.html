<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひとりテックニュース</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f7fb;
    color: #111;
}

/* ===== ナビ ===== */
.nav {
    background: #111;
    padding: 12px 18px;
    display: flex;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 1000;
    align-items: center;
    overflow-x: auto;
}

.nav a {
    color: white;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    opacity: 0.85;
    padding: 6px 10px;
    border-radius: 8px;
    white-space: nowrap;
}

.nav a:hover {
    opacity: 1;
    background: rgba(255,255,255,0.12);
}

/* ===== ヘッダー（新聞っぽく） ===== */
header {
    background: white;
    padding: 18px;
    border-bottom: 1px solid #eee;
}

header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
}

/* ===== コンテナ ===== */
.container {
    max-width: 780px;
    margin: auto;
    padding: 10px 12px;
}

/* ===== セクション（重要） ===== */
.section-title {
    font-size: 13px;
    font-weight: 700;
    color: #666;
    margin: 18px 0 8px;
    padding-left: 6px;
}

/* ===== 記事リスト型（カードやめる） ===== */
.card {
    display: block;
    background: white;
    padding: 14px 14px;
    border-bottom: 1px solid #eee;
    text-decoration: none;
    color: inherit;
    transition: 0.15s;
}

.card:hover {
    background: #f9fafb;
}

/* タグ */
.tag {
    display: inline-block;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    color: white;
    margin-bottom: 6px;
}

/* タイトル */
.title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 4px;
}

/* メタ */
.meta {
    font-size: 12px;
    color: #888;
}

/* ===== 強調記事（1個目だけ） ===== */
.card.featured {
    padding: 16px;
    background: #ffffff;
}

.card.featured .title {
    font-size: 17px;
}

/* ===== モバイル ===== */
@media (max-width: 600px) {
    header h1 {
        font-size: 16px;
    }

    .card {
        padding: 12px;
    }
}
</style>
</head>

<body>
<header>
<h1>ひとりテックニュース</h1>
</header>
<nav class="nav">
  <a href="/index.html">ホーム</a>
  <a href="/posts/ai/">AI</a>
  <a href="/posts/gadgets/">ガジェット</a>
  <a href="/posts/news/">ニュース</a>
</nav>



<div class="container">

</div>

</body>
</html>
