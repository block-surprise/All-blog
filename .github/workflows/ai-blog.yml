name: AI Blog Generator

permissions:
  contents: write

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =====================
      # リポジトリ取得
      # =====================
      - name: Checkout repo
        uses: actions/checkout@v4

      # =====================
      # Pythonセットアップ
      # =====================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # =====================
      # 依存関係インストール（修正箇所★）
      # =====================
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-generativeai feedparser requests markdown beautifulsoup4

      # =====================
      # 記事生成
      # =====================
      - name: Generate article
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python generate.py

      # =====================
      # ホーム更新
      # =====================
      - name: Update homepage
        run: python .github/workflows/update_home.py

      # =====================
      # sitemap生成
      # =====================
      - name: Generate sitemap
        run: python .github/workflows/generate_sitemap.py

      # =====================
      # commit & push（修正箇所★）
      # =====================
      - name: Commit and push
        run: |
          git config user.name "ai-bot"
          git config user.email "bot@example.com"
          # 自動生成された画像フォルダ「images」も忘れずにコミット対象（git add）に追加します
          git add posts search index.html sitemap.xml images .github/workflows/*.yml
          git commit -m "Auto generated article and images" || echo "No changes to commit"
          git push
