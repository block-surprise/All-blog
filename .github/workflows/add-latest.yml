name: Add Latest Widget

on:
workflow_dispatch:

jobs:
update:
runs-on: ubuntu-latest

steps:
  - uses: actions/checkout@v4
  - uses: actions/setup-python@v5
    with:
      python-version: "3.11"
  - name: Run script
    run: python add_latest.py
  - name: Commit changes
    run: |
      git config user.name "github-actions"
      git config user.email "actions@github.com"
      git add .
      git diff --cached --quiet || git commit -m "Add latest widget"
      git push
