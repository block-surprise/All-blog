name: game-blog-update

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */3 * * *"
  push:
    paths:
      - "game_posts/**"
      - "game/**"
      - "generate_game.py"
      - "build_game.py"
      - "search_builder.py"
      - "game_search_builder.py"
      - "sitemap.py"
      - ".github/workflows/game-blog.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =====================
      # リポジトリ取得
      # =====================
      - name: Checkout
        uses: actions/checkout@v4

      # =====================
      # Pythonセットアップ
      # =====================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # =====================
      # 依存関係
      # =====================
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-generativeai feedparser requests

      # =====================
      # 記事生成
      # =====================
      - name: Generate game article
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python generate_game.py

      # =====================
      # ホームページ生成
      # =====================
      - name: Build homepage
        run: python build_game.py

      # =====================
      # ゲーム検索ページ生成
      # =====================
      - name: Build search pages
        run: python .github/workflows/game_search_builder.py

      # =====================
      # sitemap生成
      # =====================
      - name: Build sitemap
        run: python sitemap.xml

      # =====================
      # commit & push
      # =====================
      - name: Commit and push
        run: |
          git config user.name "ai-bot"
          git config user.email "bot@example.com"
          git add -A
          git commit -m "auto update game blog" || echo "no changes"
          git push
