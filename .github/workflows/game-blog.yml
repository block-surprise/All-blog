name: game-blog-update

on:
  schedule:
    - cron: "0 */3 * * *"
  push:
    paths:
      - "game_posts/**"
      - ".github/workflows/game-blog.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run build script
        run: python build_game.py

      - name: Commit and push
        run: |
          git config user.name "ai-bot"
          git config user.email "bot@example.com"
          git add posts search index.html .github/workflows/*.yml
          git commit -m "auto update" || echo "no changes"
          git push
